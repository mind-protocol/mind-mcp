services:
  # ── Mind Home: citizen runtime (physics + orchestrator + bridges) ────────
  - type: web
    name: mind-home
    runtime: docker
    plan: pro
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: HOME_ID
        value: mind-home-core
      - key: CLOUD_MODE
        value: "true"
      - key: RENDER
        value: "true"
      - key: MAX_PARALLEL
        value: "15"
      - key: MIND_PUBLIC_URL
        value: https://mind-home.onrender.com
      # Graph database
      - key: DATABASE_BACKEND
        value: falkordb
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_GRAPH
        sync: false
      # Claude accounts (JSON credential blobs)
      - key: CLAUDE_CREDS_A
        sync: false
      - key: CLAUDE_CREDS_B
        sync: false
      - key: CLAUDE_CREDS_C
        sync: false
      # AI / API keys
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # Bridges
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WAHA_URL
        sync: false
      - key: WAHA_API_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      # Embeddings
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      # Model selection
      - key: SELECTED_MODEL
        value: claude-opus-4-5
    disk:
      name: mind-home-data
      mountPath: /data
      sizeGB: 20
