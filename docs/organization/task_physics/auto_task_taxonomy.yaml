# META-OBJECTIVES
# ═════════════════════════════════════════════════════════════════════
# High-level objectives that tasks CONTRIBUTES_TO.
# These are not tasks — they're attractors. Tasks accumulate energy
# from them via CONTRIBUTES_TO links.

meta_objectives:

  - id: citizen_operational
    principle: Every citizen exists correctly across L1/L3/L4 with brain, drives, values, keys, partner, and org.
    energy: always > 0  # organizational attractor — never fully satisfied

  - id: organization_productive
    principle: Tasks flow through the dependency graph without deadlocks, stalls, or orphans.
    energy: always > 0

  - id: economy_healthy
    principle: Settlement cycles run, bonds equalize, sybil attacks are repatriated, UBC distributes.
    energy: always > 0

  - id: system_healthy
    principle: Graph integrity holds, physics conserve energy, neurons are clean, queues are healthy.
    energy: always > 0

