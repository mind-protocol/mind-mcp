# MIND Graph Schema v1.9.1
# Query vs Intention + Complete Physics + SubEntity Traversal + Synthesis v2.0

version: "1.9.1"
updated: "2026-03-12"
status: "CANONICAL"

# =============================================================================
# CORE PRINCIPLES
# =============================================================================
#
# 1. Single link type: `link` — all semantics in properties
# 2. Everything evolves: Traversals color links (emotions, permanence, polarity, embedding)
# 3. Intention drives attention: SubEntities navigate, graph holds energy
# 4. Emotions emerge: From relationships to narratives/moments via alignment formula
# 5. Synthesis regenerates: From floats, re-embedded on drift
# 6. No arbitrary constants: All rates derived from graph properties
# 7. Narratives emerge: From crystallized traversals that find novelty
# 8. Bidirectional vocabulary: Same grammar for input (agent) and output (synthesis)
#
# =============================================================================
# NODE TYPES
# =============================================================================

nodes:

  actor:
    role: "Pump"
    behavior: "Injects energy via moments, spawns root subentity for queries"

  moment:
    role: "Router + Branch Point"
    behavior: "Receives intention, can spawn subentities, only node type where branching occurs"

    fields:
      status:
        type: enum
        values: [possible, active, completed]
        default: possible
      tick_created:
        type: int
        default: 0
      tick_resolved:
        type: int
        nullable: true

  narrative:
    role: "Attractor"
    behavior: "Destination of exploration, source of reflection, created by crystallization"


  space:
    role: "Context container"
    behavior: "Bidirectional flow with contents"


  thing:
    role: "Fast passthrough"
    behavior: "Receives briefly, tends toward 0"

    fields:
      uri:
        type: string
        nullable: true

# =============================================================================
# NODE SCHEMA
# =============================================================================

NodeBase:
  fields:
    # === Identity ===
    id:
      type: string
      required: true
    name:
      type: string
      required: true
    node_type:
      type: enum
      values: [actor, moment, narrative, space, thing]
      required: true
    type: # Free-form subtype
      type: string
      nullable: true

    # === Physics ===
    weight:
      type: float
      range: [0, infinity]
      default: 1.0
    energy:
      type: float
      range: [0, infinity]
      default: 0.0

    # === Text Data ===
    synthesis: # Natural language summary for embedding
      type: string
      required: true
    content: # Full prose text, code, or log output
      type: string
      nullable: true

    # === Embedding ===
    embedding: # embed(synthesis), updated on drift
      type: vector

    # === Metadata ===
    granularity: # Content granularity: 1=full doc, 2=per-section, 3=per-item
      type: int
      nullable: true
      values: [1, 2, 3]

    # === Temporal (auto-managed) ===
    created_at_s:
      type: int
      required: true
      auto: true
    updated_at_s:
      type: int
      required: true
      auto: true
    last_traversed_at_s:
      type: int
      nullable: true
      auto: true

# =============================================================================
# MOMENT BASE (extends NodeBase)
# =============================================================================

MomentBase:
  extends: NodeBase
  fields:
    started_at_s: # When moment became active
      type: int
      nullable: true
      auto: true
    completed_at_s: # When moment was resolved
      type: int
      nullable: true
      auto: true
    duration_s: # completed_at_s - started_at_s
      type: int
      nullable: true
      computed: true

# =============================================================================
# LINK SCHEMA
# =============================================================================

links:
  link: # Universal link — all relationships
    valid_from: [actor, space, thing, narrative, moment]
    valid_to: [actor, space, thing, narrative, moment]
    energy_carrier: true

LinkBase:
  fields:
    # === Identity ===
    id:
      type: string
      required: true
    node_a:
      type: string
      required: true
    node_b:
      type: string
      required: true

    # === Physics ===
    weight: # Importance + accumulated depth
      type: float
      range: [0, infinity]
      default: 1.0
    energy: # Current activation
      type: float
      range: [0, infinity]
      default: 0.0

    # === Semantic Axes ===
    polarity: # [a->b, b->a] flow strength
      type: array
      items: float
      length: 2
      range: each [0, 1]
      default: [0.5, 0.5]
    hierarchy: # -1 = contains, +1 = elaborates
      type: float
      range: [-1, +1]
      default: 0.0
    permanence: # 0 = speculative, 1 = definitive
      type: float
      range: [0, 1]
      default: 0.5

    # === Emotions (Plutchik 4 bipolar axes) ===
    joy_sadness:
      type: float
      range: [-1, +1]
      default: 0.0
    trust_disgust:
      type: float
      range: [-1, +1]
      default: 0.0
    fear_anger:
      type: float
      range: [-1, +1]
      default: 0.0
    surprise_anticipation:
      type: float
      range: [-1, +1]
      default: 0.0

    # === Text Data ===
    synthesis: # Human-readable, regenerated on drift
      type: string
    embedding: # Source of truth, accumulates intentions
      type: vector

    # === Temporal (auto-managed) ===
    created_at_s:
      type: int
      required: true
      auto: true
    updated_at_s:
      type: int
      required: true
      auto: true
    last_traversed_at_s:
      type: int
      nullable: true
      auto: true

# =============================================================================
# SUBENTITY SCHEMA
# =============================================================================
#
# A subentity is a temporary consciousness navigating the graph.
# NOT persistent — exists only during exploration.
# Creates Narratives when crystallizing on novel patterns.

SubEntity: # Temporary traversal consciousness
  fields:
    # === Identity ===
    id:
      type: string
      required: true
    parent_id: # null for root subentities
      type: string
      nullable: true
    origin_moment: # Moment that spawned this exploration
      type: string
      required: true
    sibling_ids: # IDs of other children of same parent (lazy refs via ExplorationContext)
      type: array
      items: string
    children_ids: # IDs of spawned subentities from branching
      type: array
      items: string

    # === Query vs Intention (fixed at creation) ===
    #
    # Query: WHAT we're searching for in the graph
    #   Example: "Recent events in the Great Hall"
    #   → Determines MATCH criteria, semantic similarity targets
    #
    # Intention: WHY the agent is searching / what to do with results
    #   Example: "Write scene summary for narrator" or "Find next possible moment"
    #   → Colors traversal: priority, stopping conditions, return filtering
    #
    # Same query, different intentions:
    #   Query: "Events in Great Hall"
    #   Intention: "Write summary"     → Privilege rich content, deep exploration
    #   Intention: "Check coherence"   → Look for tensions, contradictions
    #   Intention: "Find next moment"  → Stop at first possible moment
    #
    query: # Text of what we're searching for
      type: string
      required: true
    query_embedding: # Embedding of query — used for semantic matching
      type: vector
      required: true
    intention: # Why searching — colors priority, stopping, and filtering
      type: string
      required: true
    intention_embedding: # Embedding of intention — used for traversal weighting
      type: vector
      required: true
    intention_type: # summarize | verify | find_next | explore | retrieve
      type: enum
      values: [summarize, verify, find_next, explore, retrieve]
      default: explore

    # === Position ===
    position: # Current node ID
      type: string
    path: # Traversal history
      type: array
      items: [link_id, node_id]

    # === Emotional State (evolves) ===
    joy_sadness:
      type: float
      range: [-1, +1]
      default: 0.0
    trust_disgust:
      type: float
      range: [-1, +1]
      default: 0.0
    fear_anger:
      type: float
      range: [-1, +1]
      default: 0.0
    surprise_anticipation:
      type: float
      range: [-1, +1]
      default: 0.0

    # === Cognitive State ===
    criticality: # (1 - satisfaction) x (depth / (depth + 1))
      type: float
      range: [0, 1]

    # === Awareness ===
    crystallization_embedding: # What this subentity would become if crystallized now
      type: vector

    # === Findings ===
    found_narratives: # {narrative_id: max_alignment} — on merge, take max per narrative
      type: dict
      key: string
      value: float
    crystallized: # Narrative ID if this subentity created one
      type: string
      nullable: true

    # === Status ===
    status:
      type: enum
      values: [seeking, branching, resonating, reflecting, crystallizing, merging]
      default: seeking

# =============================================================================
# SUBENTITY STATE MACHINE
# =============================================================================
#
# SEEKING      -> exploring, choosing next link
# BRANCHING    -> multiple valid paths, spawning children
# RESONATING   -> arrived at narrative, measuring alignment
# REFLECTING   -> backpropagating reaction through path
# CRYSTALLIZING -> creating new narrative from traversal
# MERGING      -> integrating child results
#
# Transitions:
#   SEEKING:
#     - position.node_type == 'narrative' -> RESONATING
#     - no link with score > 0 -> terminate, signal parent
#     - on Moment AND len(outgoing) >= 2 -> BRANCHING
#     - else -> advance to best link, stay SEEKING
#
#   BRANCHING:
#     - spawn children, each starts SEEKING
#     - parent waits for all children
#     - when all children done -> MERGING
#
#   RESONATING:
#     - always -> REFLECTING
#
#   REFLECTING:
#     - alignment strong -> signal parent done
#     - alignment weak + criticality > 0.8 -> CRYSTALLIZING
#     - alignment mid -> SEEKING
#
#   CRYSTALLIZING:
#     - creates narrative, backprops -> triggers parent MERGING
#
#   MERGING:
#     - integrates child results -> signal parent done

